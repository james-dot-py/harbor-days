# Deploys Ope! to playope.com — fires on every push to main.
# The owner merging autopilot -> main IS the release action.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      # `npm run build` stays strictly single-file (copyPublicDir:false — dist/ is
      # exactly index.html, still shareable as one artifact). The PWA extras ride
      # along as separate Pages files, copied in here. public/ goes FIRST so
      # nothing can overwrite the built dist/index.html; 404.html is then the game.
      - run: cp -r public/. dist/ && cp dist/index.html dist/404.html && echo playope.com > dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
