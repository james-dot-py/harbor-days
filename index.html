<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ope! — north side, chicago</title>
<style>
  :root{--cream:#fdf6e6;--ink:#4a3b2f;--peach:#ffb98a;--teal:#2fa3b5;}
  html,body{margin:0;padding:0;overflow:hidden;background:var(--peach);
    font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  canvas{display:block}

  #title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 20%, #ffd9b0 0%, #ffb98a 45%, #e98f7d 100%);transition:opacity 1s ease;}
  #title.hide{opacity:0;pointer-events:none}
  /* drifting dusk clouds behind the card */
  #title::before,#title::after{content:'';position:absolute;width:46vmax;height:16vmax;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,236,214,.75),rgba(255,236,214,0));
    animation:cloudDrift 26s linear infinite;top:14%;left:-46vmax;}
  #title::after{top:62%;width:34vmax;height:12vmax;animation-duration:34s;animation-delay:-18s;
    background:radial-gradient(closest-side,rgba(255,214,196,.6),rgba(255,214,196,0));}
  @keyframes cloudDrift{to{transform:translateX(192vmax)}}
  .card{position:relative;background:var(--cream);border-radius:28px;padding:34px 44px 30px;text-align:center;
    box-shadow:0 14px 0 rgba(122,62,44,.28), 0 30px 60px rgba(122,62,44,.25);max-width:86vw;
    animation:cardIn .8s cubic-bezier(.22,1.2,.36,1) both;transition:transform 1s ease;}
  #title.hide .card{transform:translateY(-14px) scale(.97)}
  @keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
  .card h1{margin:0;color:var(--ink);font-size:clamp(34px,7vw,58px);letter-spacing:.06em;text-shadow:0 3px 0 #f3d9a7;
    animation:titleFloat 4.2s ease-in-out infinite alternate;}
  @keyframes titleFloat{from{transform:translateY(0)}to{transform:translateY(-5px)}}
  .card h1 .o,.card h1 .b{display:inline-block;animation:letterBob 2.6s ease-in-out infinite alternate}
  .card h1 .o{color:#e0766a}.card h1 .b{color:#4fa3c7;animation-delay:-1.3s}
  @keyframes letterBob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  .card .sub{margin:10px 0 4px;color:#8a7561;font-size:15px;letter-spacing:.12em;text-transform:lowercase}
  .card .tiny{margin:2px 0 20px;color:#b39d85;font-size:12px;letter-spacing:.08em}
  #start{cursor:pointer;border:none;border-radius:999px;padding:14px 46px;font-size:20px;font-family:inherit;
    letter-spacing:.1em;color:#fff;background:#5db06b;box-shadow:0 6px 0 #3f8a4d;
    transition:transform .14s ease,box-shadow .14s ease,background .14s ease;}
  #start:hover{transform:translateY(-2px);box-shadow:0 8px 0 #3f8a4d;background:#65ba74}
  #start:active{transform:translateY(4px);box-shadow:0 2px 0 #3f8a4d}
  /* small "Support development ♥" line under the start button (own tab; never
     part of the start gesture) */
  .card .kofilink{display:inline-block;margin-top:16px;color:#c07a4a;font-size:13px;letter-spacing:.06em;
    text-decoration:none;border-bottom:1px dotted #d8b48a;padding-bottom:1px;transition:color .15s ease}
  .card .kofilink:hover{color:#e0766a}
  .card .kofilink .kh{color:#e0766a}
  /* soft warm vignette over the 3D view (under all HUD) */
  #vig{position:fixed;inset:0;z-index:10;pointer-events:none;
    background:radial-gradient(130% 105% at 50% 42%, rgba(0,0,0,0) 58%, rgba(84,44,58,.16) 82%, rgba(60,28,44,.32) 100%);}

  .pill{position:fixed;top:14px;left:14px;z-index:20;display:flex;align-items:center;gap:9px;
    background:rgba(253,246,230,.92);border-radius:999px;padding:9px 16px 9px 12px;color:var(--ink);
    font-size:14px;letter-spacing:.06em;box-shadow:0 4px 0 rgba(122,62,44,.18);}
  .pill .dot{width:13px;height:13px;border-radius:50%;background:#ff9ec7;box-shadow:0 0 8px 1px rgba(255,158,199,.8)}
  .pill .key{opacity:.5;font-size:12px;margin-left:2px}
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;color:#fff;
    background:rgba(74,59,47,.55);padding:8px 18px;border-radius:999px;font-size:13px;letter-spacing:.05em;
    transition:opacity 1.2s ease;white-space:nowrap;}
  #hint.hide{opacity:0}
  /* ?dbg=1: coords are selectable + click-to-copy (main.js wires the click) */
  #hint.dbg{-webkit-user-select:text;user-select:text;cursor:copy;pointer-events:auto;}
  #banner{position:fixed;top:11%;left:50%;transform:translate(-50%,-14px);z-index:20;opacity:0;
    background:rgba(253,246,230,.95);color:var(--ink);padding:12px 30px;border-radius:999px;
    font-size:clamp(16px,3.4vw,22px);letter-spacing:.14em;box-shadow:0 5px 0 rgba(122,62,44,.2);
    transition:opacity .5s ease, transform .5s ease;pointer-events:none;text-align:center;}
  #banner.show{opacity:1;transform:translate(-50%,0)}
  #banner .z{display:block;font-size:10px;letter-spacing:.3em;color:#c48f5f;margin-bottom:2px}
  #mark{position:fixed;bottom:10px;right:14px;z-index:20;color:rgba(255,255,255,.55);font-size:11px;letter-spacing:.1em}
  /* ?audiodbg=1 — live AudioContext-state probe (owner reads it on-device) */
  #audiodbg{position:fixed;bottom:34px;right:14px;z-index:22;display:none;color:#fff;pointer-events:none;
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:rgba(20,24,30,.62);padding:4px 9px;border-radius:8px;letter-spacing:.02em}

  /* ---------- minimap ---------- */
  #mini{position:fixed;top:14px;right:14px;z-index:21;width:152px;height:206px;border-radius:18px;overflow:hidden;
    box-shadow:0 5px 0 rgba(122,62,44,.22), 0 10px 24px rgba(122,62,44,.25);background:#2fa3b5;
    transition:width .28s ease,height .28s ease,border-radius .28s ease;}
  #mini canvas{width:100%;height:100%;display:block;transition:opacity .2s ease}
  #mmt{position:absolute;top:5px;right:5px;width:26px;height:26px;border:none;border-radius:50%;cursor:pointer;
    background:rgba(253,246,230,.92);color:var(--ink);font-size:14px;line-height:1;box-shadow:0 2px 0 rgba(122,62,44,.25);
    display:flex;align-items:center;justify-content:center;padding:0}
  #mini.min{width:44px;height:44px;border-radius:50%}
  #mini.min canvas{opacity:0}
  #mini.min #mmt{top:0;right:0;width:44px;height:44px;font-size:20px;background:rgba(253,246,230,.95)}

  #jzone,#btnFire,#btnType,#btnJump{display:none}
  body.touch #jzone{display:block;position:fixed;left:0;bottom:0;width:46vw;height:58vh;z-index:15}
  body.touch #stick{position:absolute;width:96px;height:96px;border-radius:50%;border:3px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.12);transform:translate(-50%,-50%);display:none}
  body.touch #nub{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.75);transform:translate(-50%,-50%)}
  body.touch #btnFire{display:flex;position:fixed;right:20px;bottom:26px;width:76px;height:76px;border-radius:50%;
    align-items:center;justify-content:center;font-size:34px;z-index:16;background:rgba(253,246,230,.9);
    box-shadow:0 5px 0 rgba(122,62,44,.25);border:none}
  body.touch #btnType{display:flex;position:fixed;right:34px;bottom:118px;width:52px;height:52px;border-radius:50%;
    align-items:center;justify-content:center;font-size:22px;z-index:16;background:rgba(253,246,230,.75);
    box-shadow:0 4px 0 rgba(122,62,44,.2);border:none}
  body.touch #btnJump{display:flex;position:fixed;right:112px;bottom:112px;width:58px;height:58px;border-radius:50%;
    align-items:center;justify-content:center;font-size:26px;z-index:16;background:rgba(253,246,230,.85);
    box-shadow:0 4px 0 rgba(122,62,44,.22);border:none}
  body.touch #hint{bottom:auto;top:58px}

  /* ---------- framework HUD (interactions / toast / journal / power) ---------- */
  #prompt{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:20;display:none;
    align-items:center;gap:8px;background:rgba(253,246,230,.94);color:var(--ink);border-radius:999px;
    padding:8px 17px;font-size:14px;letter-spacing:.05em;box-shadow:0 4px 0 rgba(122,62,44,.18);white-space:nowrap;}
  #prompt .pk{font-weight:700;color:#e0766a;font-size:16px}
  #pwrmeter{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:20;width:180px;height:12px;
    border-radius:999px;background:rgba(74,59,47,.35);overflow:hidden;display:none;box-shadow:0 3px 0 rgba(122,62,44,.18);}
  #pwrfill{height:100%;width:0%;background:linear-gradient(90deg,#8fce74,#ffd166,#e0766a);border-radius:999px}
  #toast{position:fixed;top:20%;left:50%;transform:translate(-50%,-14px);z-index:22;opacity:0;pointer-events:none;
    display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,#fff4d6,#ffe6a8);color:#6b4d1e;
    padding:12px 24px;border-radius:22px;max-width:80vw;text-align:left;
    box-shadow:0 5px 0 rgba(176,132,32,.35),0 12px 26px rgba(176,132,32,.22);
    transition:opacity .4s ease,transform .4s ease;}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast .tsp{font-size:22px;line-height:1}
  #toastMain{font-size:16px;font-weight:700;letter-spacing:.02em}
  #toastSub{font-size:12px;color:#9a7a3a;letter-spacing:.04em}
  #toastSub:empty{display:none}
  .npcbubble{position:fixed;z-index:19;transform:translate(-50%,-100%);pointer-events:none;display:none;
    background:rgba(253,246,230,.96);color:var(--ink);padding:6px 12px;border-radius:14px;font-size:13px;
    letter-spacing:.02em;box-shadow:0 3px 0 rgba(122,62,44,.18);white-space:nowrap;}
  .npcbubble::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    border:7px solid transparent;border-top-color:rgba(253,246,230,.96);border-bottom:0}
  #journal{position:fixed;inset:0;z-index:28;display:none;align-items:center;justify-content:center;
    background:rgba(74,59,47,.42);}
  #journal.show{display:flex}
  .jcard{position:relative;background:var(--cream);border-radius:24px;padding:26px 30px 24px;max-width:min(560px,88vw);
    max-height:80vh;overflow-y:auto;box-shadow:0 14px 0 rgba(122,62,44,.28),0 30px 60px rgba(122,62,44,.25);}
  .jtitle{margin:0 4px 12px 0;color:var(--ink);font-size:30px;letter-spacing:.06em;text-shadow:0 2px 0 #f3d9a7}
  #journalClose{position:absolute;top:14px;right:16px;width:34px;height:34px;border:none;border-radius:50%;cursor:pointer;
    background:#e0766a;color:#fff;font-size:20px;line-height:1;box-shadow:0 3px 0 rgba(122,62,44,.3);padding:0}
  .jsec{margin:14px 0 4px}
  .jsec h2{margin:0 0 6px;color:#8a5a3a;font-size:15px;letter-spacing:.09em;text-transform:uppercase}
  .jrow{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px dashed #e3d3b4;
    color:var(--ink);font-size:14px}
  .jrow b{color:#c4622f}

  /* ---------- controls help: pinned "?" button + card ---------- */
  #btnHelp{position:fixed;left:14px;bottom:12px;width:34px;height:34px;border:none;border-radius:50%;cursor:pointer;
    z-index:21;background:rgba(253,246,230,.92);color:var(--ink);font-size:17px;font-weight:700;line-height:1;
    box-shadow:0 3px 0 rgba(122,62,44,.22);display:none;align-items:center;justify-content:center;padding:0}
  body.touch #btnHelp{left:auto;right:14px;top:284px;bottom:auto;width:44px;height:44px;font-size:20px}
  /* ♥ support button beside the "?" help button (same HUD styling family) */
  #btnKofi{position:fixed;left:54px;bottom:12px;width:34px;height:34px;border:none;border-radius:50%;cursor:pointer;
    z-index:21;background:rgba(253,246,230,.92);color:#e0766a;font-size:16px;line-height:1;text-decoration:none;
    box-shadow:0 3px 0 rgba(122,62,44,.22);display:none;align-items:center;justify-content:center;padding:0}
  body.touch #btnKofi{left:auto;right:14px;top:334px;bottom:auto;width:44px;height:44px;font-size:20px}
  #ctl{position:fixed;inset:0;z-index:27;display:none;align-items:center;justify-content:center;
    background:rgba(74,59,47,.38)}
  #ctl.show{display:flex}
  .ctlcard{position:relative;background:var(--cream);color:var(--ink);border-radius:22px;
    padding:22px 26px 18px;width:min(420px,86vw);max-height:78vh;overflow-y:auto;
    box-shadow:0 10px 0 rgba(122,62,44,.28),0 24px 50px rgba(122,62,44,.25)}
  .ctlcard h1{font-size:16px;letter-spacing:.22em;margin:0 0 12px;text-align:center;color:var(--ink);
    text-shadow:0 2px 0 #f3d9a7}
  .ctlrow{display:flex;align-items:baseline;gap:12px;margin:7px 0;font-size:13.5px;letter-spacing:.03em}
  .ctlrow b{flex:0 0 118px;text-align:right;font-weight:700;color:#c4622f;white-space:nowrap}
  .ctlnote{margin-top:12px;padding-top:10px;border-top:1px dashed #e3d3b4;font-size:12px;
    line-height:1.6;color:rgba(74,59,47,.9)}
  #ctlClose{position:absolute;top:12px;right:14px;width:30px;height:30px;border:none;border-radius:50%;cursor:pointer;
    background:#e0766a;color:#fff;font-size:16px;line-height:1;box-shadow:0 2px 0 rgba(122,62,44,.3);padding:0}
  #btnAct,#btnJournal{display:none}
  body.touch #btnAct{display:none;position:fixed;right:110px;bottom:26px;width:70px;height:70px;border-radius:50%;
    align-items:center;justify-content:center;font-size:30px;z-index:16;background:rgba(253,246,230,.9);
    box-shadow:0 5px 0 rgba(122,62,44,.25);border:none}
  body.touch #btnJournal{display:flex;position:fixed;right:14px;top:228px;width:44px;height:44px;border-radius:50%;
    align-items:center;justify-content:center;font-size:22px;z-index:21;background:rgba(253,246,230,.92);
    box-shadow:0 4px 0 rgba(122,62,44,.22);border:none}
</style>
</head>
<body>
<div id="title">
  <div class="card">
    <h1><span class="o">O</span>pe<span class="b">!</span></h1>
    <div class="sub">a north side stroll &mdash; the rocks, the harbor, the skyline</div>
    <div class="tiny">v0.9 &middot; the place itself &middot; belmont harbor, chicago</div>
    <button id="start">let's walk</button>
    <a class="kofilink" href="https://ko-fi.com/jimbobuildsope" target="_blank" rel="noopener">Support development <span class="kh">&hearts;</span></a>
  </div>
</div>
<div id="vig"></div>
<div class="pill" id="pill" style="display:none"><span class="dot" id="pdot"></span><span id="pname">Peony</span><span class="key" id="pkey">1&ndash;4</span></div>
<div id="hint" style="display:none"></div>
<div id="banner"><span class="z">now entering</span><span id="bname"></span></div>
<div id="mark">ope! &middot; v0.9</div>
<div id="audiodbg"></div>
<div id="mini" style="display:none"><canvas id="mmc" width="304" height="412"></canvas><button id="mmt">&#9662;</button></div>
<div id="jzone"><div id="stick"><div id="nub"></div></div></div>
<button id="btnFire">&#127878;</button>
<button id="btnType">&#10024;</button>
<button id="btnJump">&#11014;&#65039;</button>
<button id="btnAct">&#9995;</button>
<button id="btnJournal">&#128214;</button>

<!-- framework HUD -->
<div id="prompt"><span class="pk"></span><span id="promptlabel"></span></div>
<div id="pwrmeter"><div id="pwrfill"></div></div>
<div id="toast"><span class="tsp">&#10024;</span><div class="ttext"><div id="toastMain"></div><div id="toastSub"></div></div></div>
<div id="journal"><div class="jcard"><button id="journalClose">&times;</button><h1 class="jtitle">Journal</h1><div id="journalBody"></div></div></div>
<button id="btnHelp">?</button>
<a id="btnKofi" href="https://ko-fi.com/jimbobuildsope" target="_blank" rel="noopener" aria-label="Support development on Ko-fi" title="Support development">&hearts;</a>
<div id="ctl"><div class="ctlcard"><button id="ctlClose">&times;</button><h1>CONTROLS</h1><div id="ctlBody"></div></div></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
